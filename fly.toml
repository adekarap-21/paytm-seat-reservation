app = "paytm-seat-reservation"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATABASE_URL = "mysql://app:devpass@127.0.0.1:3306/seatres"
  LOG_LEVEL = "info"

[[mounts]]
  source = "mysql_data"
  destination = "/data/mysql"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 500
    soft_limit = 400

[[http_service.checks]]
  grace_period = "20s"
  interval = "10s"
  method = "get"
  path = "/readyz"
  protocol = "http"
  timeout = "3s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
